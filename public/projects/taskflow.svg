    <text x="1130" y="250" font-size="16" fill="#b8ff3c">✓</text>

    <rect x="900" y="330" width="258" height="96" rx="12" fill="#131d3a" stroke="#263459"/>
    <text x="922" y="362" font-size="14" font-weight="700" fill="#f5f5f0" fill-opacity="0.75">Drag &amp; drop kanban</text>
