    <text x="1130" y="362" font-size="16" fill="#b8ff3c">✓</text>

    <rect x="900" y="442" width="258" height="96" rx="12" fill="#131d3a" stroke="#263459"/>
    <text x="922" y="474" font-size="14" font-weight="700" fill="#f5f5f0" fill-opacity="0.75">Notifications push</text>
    <text x="922" y="498" font-size="12" fill="#7d879f">Livré le 20/02</text>
    <text x="1130" y="474" font-size="16" fill="#b8ff3c">✓</text>
