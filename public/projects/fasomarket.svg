  <text x="100" y="240" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff">La marketplace de l'élevage au Mali</text>
  <text x="100" y="278" font-family="Arial, sans-serif" font-size="14" fill="#c8e6c9">Annonces vérifiées · Chat intégré · Orange Money &amp; Wave · Traçabilité QR · Livraison Translait</text>
  <rect x="100" y="298" width="150" height="36" rx="18" fill="#FFB300"/>
  <text x="124" y="321" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1F5C24">Voir les annonces</text>

  <!-- annonces -->
  <g>
    <rect x="60" y="378" width="345" height="320" rx="16" fill="#ffffff" stroke="#d5e5d3"/>
    <rect x="84" y="402" width="297" height="150" rx="12" fill="url(#a1)"/>
    <rect x="310" y="418" width="56" height="24" rx="12" fill="#2E7D32"/>
    <text x="322" y="435" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">QR</text>
    <text x="84" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1b3d1e">Zébu · 3 ans · Male</text>
    <text x="84" y="614" font-family="Arial, sans-serif" font-size="12" fill="#7a9a7c">Ségou · Vérifié par FASOmarket</text>
    <text x="84" y="654" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#2E7D32">325 000 FCFA</text>
    <rect x="250" y="634" width="120" height="34" rx="17" fill="#E8F5E9" stroke="#a5d6a7"/>
    <text x="274" y="656" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">Contacter</text>
  </g>

  <g>
    <rect x="427" y="378" width="345" height="320" rx="16" fill="#ffffff" stroke="#d5e5d3"/>
    <rect x="451" y="402" width="297" height="150" rx="12" fill="url(#a2)"/>
    <rect x="677" y="418" width="56" height="24" rx="12" fill="#2E7D32"/>
    <text x="689" y="435" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">QR</text>
    <text x="451" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1b3d1e">Petit ruminant · Lot de 8</text>
    <text x="451" y="614" font-family="Arial, sans-serif" font-size="12" fill="#7a9a7c">Mopti · Paiement Wave disponible</text>
    <text x="451" y="654" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#2E7D32">180 000 FCFA</text>
    <rect x="617" y="634" width="120" height="34" rx="17" fill="#E8F5E9" stroke="#a5d6a7"/>
    <text x="641" y="656" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">Contacter</text>
  </g>

  <g>
    <rect x="794" y="378" width="345" height="320" rx="16" fill="#ffffff" stroke="#d5e5d3"/>
    <rect x="818" y="402" width="297" height="150" rx="12" fill="url(#a3)"/>
    <rect x="1044" y="418" width="56" height="24" rx="12" fill="#2E7D32"/>
    <text x="1056" y="435" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">QR</text>
    <text x="818" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1b3d1e">Volaille locale · Lot de 25</text>
    <text x="818" y="614" font-family="Arial, sans-serif" font-size="12" fill="#7a9a7c">Bamako · Livraison Translait</text>
    <text x="818" y="654" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#2E7D32">95 000 FCFA</text>
    <rect x="984" y="634" width="120" height="34" rx="17" fill="#E8F5E9" stroke="#a5d6a7"/>
    <text x="1008" y="656" font-family="Arial, sans-serif" font-size="12" fill="#2E7D32">Contacter</text>
  </g>
