<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Capture d'UniGest : tableau de bord de gestion universitaire avec statistiques">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141827"/>
      <stop offset="1" stop-color="#0f1220"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2036"/>
      <stop offset="1" stop-color="#151a2e"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6cf0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c6cf0" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- chrome fenêtre desktop -->
  <rect width="1200" height="46" fill="#1a2036"/>
  <circle cx="30" cy="23" r="6.5" fill="#ff5f57"/>
  <circle cx="52" cy="23" r="6.5" fill="#febc2e"/>
  <circle cx="74" cy="23" r="6.5" fill="#28c840"/>
  <text x="520" y="28" font-family="monospace" font-size="12" fill="#8b93b5">UniGest — Université de Bamako · Année 2025-2026</text>

  <!-- sidebar -->
  <rect x="0" y="46" width="230" height="704" fill="url(#sidebar)"/>
  <text x="28" y="92" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#f5f5f0">Uni<tspan fill="#7c6cf0">Gest</tspan></text>
  <rect x="20" y="120" width="190" height="36" rx="10" fill="#7c6cf0" opacity="0.2"/>
