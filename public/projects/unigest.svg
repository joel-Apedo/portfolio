  <text x="1096" y="480" font-family="monospace" font-size="12" fill="#4ade80">200 000 F</text>
  <line x1="896" y1="494" x2="1151" y2="494" stroke="#252c4a"/>
  <text x="896" y="524" font-family="Arial, sans-serif" font-size="12" fill="#c5cbe8">Ouédraogo K. · L2 Droit</text>
  <text x="1096" y="524" font-family="monospace" font-size="12" fill="#4ade80">120 000 F</text>

