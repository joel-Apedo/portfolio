  <rect x="286" y="648" width="120" height="32" rx="16" fill="#7c6cf0" opacity="0.18"/>
  <text x="306" y="669" font-family="Arial, sans-serif" font-size="12" fill="#a89bff">Admin · tout</text>
  <rect x="422" y="648" width="180" height="32" rx="16" fill="#4ade80" opacity="0.14"/>
