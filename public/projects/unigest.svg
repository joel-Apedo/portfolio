  <text x="40" y="495" font-family="Arial, sans-serif" font-size="13" fill="#8b93b5">Sauvegardes</text>
  <rect x="20" y="680" width="190" height="44" rx="10" fill="#151a2e" stroke="#252c4a"/>
  <circle cx="44" cy="702" r="12" fill="#7c6cf0"/>
  <text x="40" y="707" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">A</text>
  <text x="64" y="698" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#f5f5f0">Admin</text>
  <text x="64" y="714" font-family="Arial, sans-serif" font-size="10" fill="#8b93b5">Administrateur</text>

