  <text x="40" y="275" font-family="Arial, sans-serif" font-size="13" fill="#8b93b5">Notes &amp; Bulletins</text>
  <text x="40" y="319" font-family="Arial, sans-serif" font-size="13" fill="#8b93b5">Absences</text>
  <text x="40" y="363" font-family="Arial, sans-serif" font-size="13" fill="#8b93b5">Finances</text>
  <text x="40" y="407" font-family="Arial, sans-serif" font-size="13" fill="#8b93b5">Bibliothèque</text>
