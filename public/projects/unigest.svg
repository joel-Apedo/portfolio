  <text x="1096" y="392" font-family="monospace" font-size="12" fill="#4ade80">120 000 F</text>
  <line x1="896" y1="406" x2="1151" y2="406" stroke="#252c4a"/>
  <text x="896" y="436" font-family="Arial, sans-serif" font-size="12" fill="#c5cbe8">Koné B. · L3 Éco</text>
