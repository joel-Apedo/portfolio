<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Capture d'ArtisanLink : accueil et annuaire d'artisans vérifiés à Bamako">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f0c"/>
      <stop offset="1" stop-color="#080c09"/>
    </linearGradient>
    <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#0d1510"/>
      <stop offset="1" stop-color="#0d1510"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddc84" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#122018"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#122018"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#122018"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- barre navigateur -->
  <rect width="1200" height="54" fill="#0d1510"/>
  <circle cx="32" cy="27" r="6.5" fill="#ff5f57"/>
  <circle cx="54" cy="27" r="6.5" fill="#febc2e"/>
  <circle cx="76" cy="27" r="6.5" fill="#28c840"/>
  <rect x="110" y="15" width="520" height="24" rx="12" fill="#080c09"/>
  <text x="128" y="31" font-family="monospace" font-size="12" fill="#5f7a68">artisanlink.bamako / accueil</text>
  <rect x="1120" y="15" width="56" height="24" rx="12" fill="#3ddc84" opacity="0.15"/>

  <!-- nav app -->
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#f5f5f0">Artisan<tspan fill="#3ddc84">Link</tspan></text>
  <text x="380" y="110" font-family="Arial, sans-serif" font-size="13" fill="#3ddc84">Accueil</text>
  <text x="470" y="110" font-family="Arial, sans-serif" font-size="13" fill="#8fa896">Artisans</text>
  <text x="570" y="110" font-family="Arial, sans-serif" font-size="13" fill="#8fa896">Rejoindre</text>
  <text x="670" y="110" font-family="Arial, sans-serif" font-size="13" fill="#8fa896">Dashboard</text>
  <rect x="1000" y="90" width="60" height="28" rx="14" fill="#122018" stroke="#1f3529"/>
  <text x="1020" y="108" font-family="Arial, sans-serif" font-size="12" fill="#f5f5f0">FR</text>
  <rect x="1072" y="90" width="68" height="28" rx="14" fill="#1f6f43"/>
  <text x="1086" y="108" font-family="Arial, sans-serif" font-size="12" fill="#f5f5f0">WhatsApp</text>

  <!-- hero -->
  <rect x="60" y="140" width="1080" height="260" rx="22" fill="url(#heroGlow)" stroke="#1f3529"/>
  <rect x="100" y="172" width="196" height="28" rx="14" fill="#3ddc84" opacity="0.14"/>
  <text x="118" y="191" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#3ddc84">SERVICE ACTIF À BAMAKO</text>
  <text x="100" y="252" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#f5f5f0">Trouvez un artisan <tspan fill="#3ddc84">fiable</tspan></text>
  <text x="100" y="302" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#f5f5f0">en <tspan fill="#f5a623">5 minutes</tspan></text>
  <text x="100" y="342" font-family="Arial, sans-serif" font-size="14" fill="#8fa896">Électricien, plombier, mécanicien — envoyez un message WhatsApp,</text>
  <text x="100" y="366" font-family="Arial, sans-serif" font-size="14" fill="#8fa896">on vous connecte à l'artisan le plus proche.</text>
  <rect x="100" y="386" width="0" height="0" fill="none"/>
  <rect x="760" y="220" width="330" height="120" rx="16" fill="#122018" stroke="#1f3529"/>
  <rect x="784" y="244" width="80" height="26" rx="13" fill="#1f6f43"/>
  <text x="800" y="262" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#f5f5f0">WhatsApp</text>
  <text x="784" y="296" font-family="Arial, sans-serif" font-size="13" fill="#f5f5f0">« Bonjour, j'ai besoin d'un</text>
  <text x="784" y="316" font-family="Arial, sans-serif" font-size="13" fill="#f5f5f0">électricien à Sicoro »</text>

  <!-- stats -->
  <text x="100" y="430" font-family="monospace" font-size="22" font-weight="700" fill="#3ddc84">20+</text>
  <text x="100" y="452" font-family="Arial, sans-serif" font-size="11" fill="#5f7a68">ARTISANS VÉRIFIÉS</text>
  <text x="280" y="430" font-family="monospace" font-size="22" font-weight="700" fill="#f5a623">150+</text>
  <text x="280" y="452" font-family="Arial, sans-serif" font-size="11" fill="#5f7a68">MISSIONS RÉALISÉES</text>
  <text x="480" y="430" font-family="monospace" font-size="22" font-weight="700" fill="#58a6ff">15%</text>
  <text x="480" y="452" font-family="Arial, sans-serif" font-size="11" fill="#5f7a68">COMMISSION UNIQUEMENT</text>

  <!-- cartes métiers -->
  <g>
    <rect x="60" y="480" width="345" height="220" rx="18" fill="#0d1510" stroke="#1f3529"/>
    <rect x="84" y="504" width="300" height="90" rx="12" fill="url(#card1)"/>
    <text x="104" y="630" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f5f5f0">Électricité</text>
    <text x="104" y="656" font-family="Arial, sans-serif" font-size="12" fill="#8fa896">Panne, installation, câblage —</text>
    <text x="104" y="676" font-family="Arial, sans-serif" font-size="12" fill="#8fa896">tout problème électrique résolu.</text>
  </g>
  <g>
    <rect x="427" y="480" width="345" height="220" rx="18" fill="#0d1510" stroke="#1f3529"/>
    <rect x="451" y="504" width="300" height="90" rx="12" fill="url(#card2)"/>
    <text x="471" y="630" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f5f5f0">Plomberie</text>
    <text x="471" y="656" font-family="Arial, sans-serif" font-size="12" fill="#8fa896">Fuite, robinet, WC —</text>
    <text x="471" y="676" font-family="Arial, sans-serif" font-size="12" fill="#8fa896">intervention rapide.</text>
  </g>
  <g>
    <rect x="794" y="480" width="345" height="220" rx="18" fill="#0d1510" stroke="#1f3529"/>
    <rect x="818" y="504" width="300" height="90" rx="12" fill="url(#card3)"/>
    <text x="838" y="630" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f5f5f0">Mécanique moto / auto</text>
    <text x="838" y="656" font-family="Arial, sans-serif" font-size="12" fill="#8fa896">Panne, vidange, freins —</text>
    <text x="838" y="676" font-family="Arial, sans-serif" font-size="12" fill="#8fa896">mécaniciens expérimentés.</text>
  </g>
</svg>
